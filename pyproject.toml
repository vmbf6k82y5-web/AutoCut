[project]
name = "autocut-ai"
version = "0.1.0"
description = "AutoCut: 输入影视剧视频，全自动产出带 AI 解说配音和字幕的解说视频"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AutoCut Contributors" }]
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "openai>=1.30",
    "edge-tts>=6.1",
    "opencv-python-headless>=4.9",
    "scenedetect[opencv-headless]>=0.6.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12.0",
    "mcp>=1.2",
    "platformdirs>=4.2",
    "jinja2>=3.1",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
jianying = ["pyJianYingDraft>=0.1"]
gemini = ["google-genai>=1.0"]
subsync = ["ffsubsync>=0.4"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
autocut = "autocut.cli:app"

[project.entry-points."autocut.providers.subtitle"]
# 内置 provider 通过代码注册；第三方包在此声明即可被发现

[project.entry-points."autocut.model_protocols"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autocut"]

[tool.hatch.build.targets.wheel.force-include]
"src/autocut/prompts" = "autocut/prompts"
"src/autocut/web/static" = "autocut/web/static"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "PL"]
ignore = [
    "PLR0913", "PLR0912", "PLR0915", "PLR2004", "PLR0917", "E501",
    "PLC0206",  # dict 键迭代取值的惯用法
    "PLC0415",  # 函数内延迟导入：避免 CLI/GUI 启动加载重依赖
    "PLW0603",  # global：注册表单例与 ffmpeg override 需要
    "PLW1510",  # subprocess.run 未显式 check：本项目用 run_cmd 包装
    "B008",     # typer 依赖注入惯用法
]

[tool.uv]
package = true
