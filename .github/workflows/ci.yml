name: CI

on:
  push:
    branches: [main]
  pull_request:

# Windows runner 控制台默认 cp1252，Python 子进程 print 中文会 UnicodeEncodeError。
# 工作流级统一开启 UTF-8 模式，覆盖所有步骤里的 Python（含 uv run），无需逐个改 print。
env:
  PYTHONUTF8: "1"

jobs:
  test:
    strategy:
      # Windows 失败不再连带取消 Ubuntu，两个平台各自跑到出结论
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Install ffmpeg (Ubuntu)
        if: runner.os == 'Linux'
        # fonts-noto-cjk：libass 渲染中文字幕需要 CJK 字体，否则字形回退失败（豆腐块）
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk fontconfig

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # choco 社区源偶发 504，且“装 0 个包”仍返回 0：必须显式校验并重试，
          # 否则失败会推迟到 Generate test media 才以 FileNotFoundError 暴露（见 Run 5）
          $ErrorActionPreference = 'Continue'  # 成败由下面的校验判断，不被非零退出中断
          for ($i = 1; $i -le 3; $i++) {
            choco install ffmpeg --no-progress -y
            if (Get-Command ffmpeg -ErrorAction SilentlyContinue) { break }
            Write-Host "::warning::第 $i 次安装后仍未找到 ffmpeg，15 秒后重试"
            Start-Sleep -Seconds 15
          }
          $ok = (Get-Command ffmpeg -ErrorAction SilentlyContinue) -and (Get-Command ffprobe -ErrorAction SilentlyContinue)
          if (-not $ok) {
            Write-Host "::error::ffmpeg/ffprobe 安装失败（choco 源不稳定）：重跑本 workflow 或改用其他安装源"
            exit 1
          }
          ffmpeg -version
          ffprobe -version

      - name: Install dependencies
        run: |
          uv venv --python 3.11 .venv
          # Windows 的 venv 解释器在 .venv\Scripts\python.exe，POSIX 在 .venv/bin/python
          uv pip install -e ".[dev]" --python "${{ runner.os == 'Windows' && '.venv\Scripts\python.exe' || '.venv/bin/python' }}"

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Generate test media
        run: uv run python scripts/make_test_media.py tests/assets

      - name: Run tests (mock only)
        run: uv run pytest tests/ -q
        env:
          AUTOCUT_FFMPEG_DIR: ""  # 使用系统 ffmpeg

      - name: Full mock pipeline (生成素材 → run → 校验 MP4)
        run: |
          uv run python -c "
          from pathlib import Path
          from autocut.config import Config, ModelSpec, Roles, ProvidersConfig
          from autocut.runner import run_video
          models=[ModelSpec(name='mt',protocol='mock',capabilities=['text','json_mode'],price_in=0.1,price_out=0.2),
                  ModelSpec(name='mv',protocol='mock',capabilities=['text','vision','video','json_mode'])]
          roles=Roles(**{r:['mt'] for r in Roles.model_fields}); roles.vision=['mv']
          cfg=Config(models=models, roles=roles, providers=ProvidersConfig(subtitle='mock',shots='fixed',loudness='mock',hardsub='none',tts='mock'))
          cfg.video.target_length='15s'
          final=run_video(Path('tests/assets/test_60s.mp4'), cfg)
          assert final.exists(), 'no output'
          print('成片:', final)
          "
